<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2320" height="1305" viewBox="0 0 2320 1305" role="img" aria-labelledby="01_trade_title"><title id="01_trade_title">01 trade</title><rect width="2320" height="1305" fill="#FFFFFF"/><g id="china_trade_chart" data-chart="china_trade" data-observations="7"><rect x="0" y="0" width="2320" height="118" fill="#EAF6F5" stroke="none" stroke-width="2" rx="14" /><rect x="0" y="16" width="9" height="86" fill="#2A9D8F" stroke="none" stroke-width="2" rx="4" /><text x="55" y="77" font-family="Comic Sans MS" font-size="43" fill="#2A9D8F" font-weight="bold" >01</text><text x="163" y="77" font-family="Comic Sans MS" font-size="49" fill="#365866" font-weight="bold" >TRADE GROWTH IS LED BY EXPORTS</text><line x1="1335" y1="170" x2="1335" y2="1170" stroke="#D9E5EA" stroke-width="2" /><text x="72" y="191" font-family="Comic Sans MS" font-size="35" fill="#365866" font-weight="bold" >Cross-border e-commerce trade</text><text x="72" y="239" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" >China · 2018–2024 · RMB trillion</text><line x1="170" y1="811" x2="1300" y2="811" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="149" y="821" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" text-anchor="end">0.0</text><line x1="170" y1="727.6666666666666" x2="1300" y2="727.6666666666666" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="149" y="737.6666666666666" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" text-anchor="end">0.5</text><line x1="170" y1="644.3333333333334" x2="1300" y2="644.3333333333334" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="149" y="654.3333333333334" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" text-anchor="end">1.0</text><line x1="170" y1="561" x2="1300" y2="561" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="149" y="571" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" text-anchor="end">1.5</text><line x1="170" y1="477.6666666666667" x2="1300" y2="477.6666666666667" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="149" y="487.6666666666667" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" text-anchor="end">2.0</text><line x1="170" y1="394.3333333333333" x2="1300" y2="394.3333333333333" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="149" y="404.3333333333333" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" text-anchor="end">2.5</text><line x1="170" y1="311" x2="1300" y2="311" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="149" y="321" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" text-anchor="end">3.0</text><path d="M 170,736.9833333333333 L 358.33333333333337,728.9666666666667 L 546.6666666666667,721.5 L 735,722.35 L 923.3333333333334,723.0333333333333 L 1111.6666666666665,722.0833333333334 L 1300,718.4666666666667 L 1300,811 L 1111.6666666666665,811 L 923.3333333333334,811 L 735,811 L 546.6666666666667,811 L 358.33333333333337,811 L 170,811 Z" fill="#ADD8E2"/><path d="M 170,635.05 L 358.33333333333337,595.95 L 546.6666666666667,540.6666666666666 L 735,490.3833333333333 L 923.3333333333334,467.68333333333334 L 1111.6666666666665,415.26666666666665 L 1300,359.8 L 1300,718.4666666666667 L 1111.6666666666665,722.0833333333334 L 923.3333333333334,723.0333333333333 L 735,722.35 L 546.6666666666667,721.5 L 358.33333333333337,728.9666666666667 L 170,736.9833333333333 Z" fill="#2A9D8F" opacity=".88"/><polyline points="170,635.05 358.33333333333337,595.95 546.6666666666667,540.6666666666666 735,490.3833333333333 923.3333333333334,467.68333333333334 1111.6666666666665,415.26666666666665 1300,359.8" fill="none" stroke="#365866" stroke-width="6"/><text x="170" y="859" font-family="Comic Sans MS" font-size="29" fill="#294052" font-weight="normal" text-anchor="middle">2018</text><circle cx="170" cy="635.05" r="7" fill="#365866"/><text x="358.33333333333337" y="859" font-family="Comic Sans MS" font-size="29" fill="#294052" font-weight="normal" text-anchor="middle">2019</text><circle cx="358.33333333333337" cy="595.95" r="7" fill="#365866"/><text x="546.6666666666667" y="859" font-family="Comic Sans MS" font-size="29" fill="#294052" font-weight="normal" text-anchor="middle">2020</text><circle cx="546.6666666666667" cy="540.6666666666666" r="7" fill="#365866"/><text x="735" y="859" font-family="Comic Sans MS" font-size="29" fill="#294052" font-weight="normal" text-anchor="middle">2021</text><circle cx="735" cy="490.3833333333333" r="7" fill="#365866"/><text x="923.3333333333334" y="859" font-family="Comic Sans MS" font-size="29" fill="#294052" font-weight="normal" text-anchor="middle">2022</text><circle cx="923.3333333333334" cy="467.68333333333334" r="7" fill="#365866"/><text x="1111.6666666666665" y="859" font-family="Comic Sans MS" font-size="29" fill="#294052" font-weight="normal" text-anchor="middle">2023</text><circle cx="1111.6666666666665" cy="415.26666666666665" r="7" fill="#365866"/><text x="1300" y="859" font-family="Comic Sans MS" font-size="29" fill="#294052" font-weight="normal" text-anchor="middle">2024</text><circle cx="1300" cy="359.8" r="7" fill="#365866"/><text x="190" y="611.05" font-family="Comic Sans MS" font-size="33" fill="#365866" font-weight="bold" >1.06</text><text x="1292" y="334.8" font-family="Comic Sans MS" font-size="33" fill="#365866" font-weight="bold" text-anchor="end">2.71</text><text x="910" y="615" font-family="Comic Sans MS" font-size="35" fill="#FFFFFF" font-weight="bold" >Exports</text><text x="890" y="770" font-family="Comic Sans MS" font-size="30" fill="#365866" font-weight="bold" >Imports</text><text x="72" y="918" font-family="Comic Sans MS" font-size="32" fill="#365866" font-weight="bold" >A slower growth rate still means expansion</text><g id="trade_chart_role" data-paragraph="trade_chart_role" data-right="1312"><text x="72" y="970" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">Annual growth was uneven: 25.7% in 2020, 7.1% in 2022, 15.3% in 2023 and 14.0% in</text><text x="72" y="1012" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">2024. The total kept rising across these years, even when the growth rate slowed.</text><text x="72" y="1054" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">For firms, this distinction matters: slower growth is still expansion, but stock and</text><text x="72" y="1096" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">delivery plans may need to allow for different rates of change. [1]</text></g></g><text x="1385" y="200" font-family="Comic Sans MS" font-size="34" fill="#365866" font-weight="bold" >Exports account for most of the expansion</text><g id="trade_explain_0" data-paragraph="trade_explain_0" data-right="2250"><text x="1385" y="252" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">China’s cross-border e-commerce trade rose from RMB</text><text x="1385" y="294" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">1.06 trillion in 2018 to RMB 2.71 trillion in 2024, up</text><text x="1385" y="336" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">156.4%. Exports increased by 251.9%, against 25.0% for</text><text x="1385" y="378" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">imports. The gap means that the expansion was</text><text x="1385" y="420" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">concentrated in selling abroad. Imports also grew, so</text><text x="1385" y="462" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">their falling share should not be confused with an</text><text x="1385" y="504" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">absolute fall in purchases from overseas.</text></g><text x="1385" y="556.6" font-family="Comic Sans MS" font-size="34" fill="#365866" font-weight="bold" >What this means for firms</text><g id="trade_explain_1" data-paragraph="trade_explain_1" data-right="2250"><text x="1385" y="608.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">The trade mix links China’s growth to overseas customers</text><text x="1385" y="650.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">and the services needed to fulfil their orders. Our</text><text x="1385" y="692.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">interpretation is that firms should consider customer</text><text x="1385" y="734.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">acquisition, payments and delivery together when planning</text><text x="1385" y="776.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">export activity. A growing national total can provide</text><text x="1385" y="818.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">context for that planning, but it does not show demand</text><text x="1385" y="860.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">for an individual product. The figures establish which</text><text x="1385" y="902.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">trade component expanded; they do not isolate the</text><text x="1385" y="944.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">causes.</text></g><line x1="65" y1="1195" x2="2255" y2="1195" stroke="#D9E5EA" stroke-width="2" /><a href="https://fms.mofcom.gov.cn/xxfb/art/2025/art_3aeb2e47113845bdb16dcb053e5f6e9d.html" target="_blank"><g id="trade_source" data-paragraph="trade_source" data-right="2255"><text x="65" y="1240" font-family="Comic Sans MS" font-size="25" fill="#718393" font-weight="normal" data-text-line="true">Source [1]: Ministry of Commerce (2025), Table 11, p. 62; China Customs data. Calculations use published values in RMB 100 million, before conversion to rounded trillion labels. Service</text><text x="65" y="1274" font-family="Comic Sans MS" font-size="25" fill="#718393" font-weight="normal" data-text-line="true">interpretation also draws on UNCTAD [5].</text></g></a></svg>