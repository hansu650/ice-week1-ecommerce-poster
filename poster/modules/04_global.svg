<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2320" height="1305" viewBox="0 0 2320 1305" role="img" aria-labelledby="04_global_title"><title id="04_global_title">04 global</title><rect width="2320" height="1305" fill="#FFFFFF"/><g id="business_sales_chart" data-chart="business_sales" data-observations="2"><rect x="0" y="0" width="2320" height="118" fill="#EAF6F5" stroke="none" stroke-width="2" rx="14" /><rect x="0" y="16" width="9" height="86" fill="#2A9D8F" stroke="none" stroke-width="2" rx="4" /><text x="55" y="77" font-family="Comic Sans MS" font-size="43" fill="#2A9D8F" font-weight="bold" >04</text><text x="163" y="77" font-family="Comic Sans MS" font-size="49" fill="#365866" font-weight="bold" >E-COMMERCE RELIES ON WIDER SUPPORT SERVICES</text><line x1="1335" y1="170" x2="1335" y2="1170" stroke="#D9E5EA" stroke-width="2" /><text x="72" y="191" font-family="Comic Sans MS" font-size="35" fill="#365866" font-weight="bold" >Business e-commerce in 43 economies</text><text x="72" y="239" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" >US&#36; trillion · includes domestic and B2B sales</text><line x1="183" y1="668" x2="1273" y2="668" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="159" y="678" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">0</text><line x1="183" y1="554.3333333333334" x2="1273" y2="554.3333333333334" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="159" y="564.3333333333334" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">10</text><line x1="183" y1="440.6666666666667" x2="1273" y2="440.6666666666667" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="159" y="450.6666666666667" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">20</text><line x1="183" y1="327" x2="1273" y2="327" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="159" y="337" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">30</text><rect x="258" y="389.51666666666665" width="244" height="278.48333333333335" fill="#ADD8E2" stroke="none" stroke-width="2" rx="0" /><text x="380" y="366.51666666666665" font-family="Comic Sans MS" font-size="49" fill="#365866" font-weight="bold" text-anchor="middle">≈25</text><text x="380" y="719" font-family="Comic Sans MS" font-size="32" fill="#365866" font-weight="bold" text-anchor="middle">2021</text><rect x="822" y="362.2366666666667" width="244" height="305.7633333333333" fill="#2A9D8F" stroke="none" stroke-width="2" rx="0" /><text x="944" y="339.2366666666667" font-family="Comic Sans MS" font-size="49" fill="#2A9D8F" font-weight="bold" text-anchor="middle">≈27</text><text x="944" y="719" font-family="Comic Sans MS" font-size="32" fill="#365866" font-weight="bold" text-anchor="middle">2022*</text><text x="665" y="488" font-family="Comic Sans MS" font-size="51" fill="#365866" font-weight="bold" text-anchor="middle">≈10%</text><text x="665" y="529" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" text-anchor="middle">reported rise</text><text x="71" y="775" font-family="Comic Sans MS" font-size="28" fill="#365866" font-weight="bold" >Reading the estimates carefully</text><g id="global_estimates" data-paragraph="global_estimates" data-right="1321"><text x="71" y="815" font-family="Comic Sans MS" font-size="26" fill="#718393" font-weight="normal" data-text-line="true">Both years include estimated components. The 2022 business-sales total is indicative: about one third</text><text x="71" y="850" font-family="Comic Sans MS" font-size="26" fill="#718393" font-weight="normal" data-text-line="true">of the total is estimated.</text></g></g><g id="platform_sales_chart" data-chart="platform_sales" data-observations="2"><text x="72" y="915" font-family="Comic Sans MS" font-size="32" fill="#365866" font-weight="bold" >37 major online platforms · partial coverage</text><text x="193" y="1005" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" text-anchor="end">2019</text><rect x="238" y="968" width="608.6363636363636" height="55" fill="#ADD8E2" stroke="none" stroke-width="2" rx="0" /><text x="864.6363636363636" y="1006" font-family="Comic Sans MS" font-size="32" fill="#365866" font-weight="bold" >≈2.6T</text><text x="193" y="1101" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" text-anchor="end">2021</text><rect x="238" y="1064" width="936.3636363636363" height="55" fill="#2A9D8F" stroke="none" stroke-width="2" rx="0" /><text x="1192.3636363636363" y="1102" font-family="Comic Sans MS" font-size="32" fill="#2A9D8F" font-weight="bold" >≈4.0T</text><text x="72" y="1167" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" >US&#36; transaction value · ≈55% rise reported by UNCTAD</text></g><text x="1385" y="200" font-family="Comic Sans MS" font-size="34" fill="#365866" font-weight="bold" >What the two totals show</text><g id="global_explain_0" data-paragraph="global_explain_0" data-right="2250"><text x="1385" y="252" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">Business e-commerce sales across 43 economies rose</text><text x="1385" y="294" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">from almost US&#36;25 trillion in 2021 to an indicative</text><text x="1385" y="336" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">US&#36;27 trillion in 2022. The separate 37-platform</text><text x="1385" y="378" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">compilation increased from around US&#36;2.6 trillion in 2019</text><text x="1385" y="420" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">to US&#36;4.0 trillion in 2021. These measures answer</text><text x="1385" y="462" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">different questions: the scale of business e-commerce</text><text x="1385" y="504" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">and the activity recorded by selected intermediaries.</text><text x="1385" y="546" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">They cover different periods and activities, so they</text><text x="1385" y="588" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">cannot be added.</text></g><text x="1385" y="640.6" font-family="Comic Sans MS" font-size="34" fill="#365866" font-weight="bold" >Services and concentration</text><g id="global_explain_1" data-paragraph="global_explain_1" data-right="2250"><text x="1385" y="692.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">Six platforms account for 80% of sales in the</text><text x="1385" y="734.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">37-platform compilation. UNCTAD also describes</text><text x="1385" y="776.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">payments, warehousing, delivery and analytics supplied by</text><text x="1385" y="818.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">platforms. Our interpretation is that these</text><text x="1385" y="860.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">intermediaries can help sellers reach customers while</text><text x="1385" y="902.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">creating dependence on a few providers. Read alongside</text><text x="1385" y="944.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">China’s export growth, the figures draw attention to</text><text x="1385" y="986.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">service partners involved in overseas selling. They do not</text><text x="1385" y="1028.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">show that China caused the changes in either the</text><text x="1385" y="1070.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">multi-economy business-sales total or the platform</text><text x="1385" y="1112.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">compilation.</text></g><line x1="65" y1="1195" x2="2255" y2="1195" stroke="#D9E5EA" stroke-width="2" /><a href="https://unctad.org/system/files/official-document/dtlecde2024d3_en.pdf" target="_blank"><g id="global_source" data-paragraph="global_source" data-right="2255"><text x="65" y="1240" font-family="Comic Sans MS" font-size="25" fill="#718393" font-weight="normal" data-text-line="true">Source [5]: UNCTAD (2024), pp. 3–4 and 31–32. Rounded figures and source-reported growth rates. The 43-economy total includes domestic and B2B sales; 2022 is indicative. Platform</text><text x="65" y="1274" font-family="Comic Sans MS" font-size="25" fill="#718393" font-weight="normal" data-text-line="true">coverage is partial. CC BY 3.0 IGO.</text></g></a></svg>