<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2320" height="1305" viewBox="0 0 2320 1305" role="img" aria-labelledby="02_consumer_title"><title id="02_consumer_title">02 consumer</title><rect width="2320" height="1305" fill="#FFFFFF"/><g id="china_origin_chart" data-chart="china_origin" data-observations="8"><rect x="0" y="0" width="2320" height="118" fill="#EAF6F5" stroke="none" stroke-width="2" rx="14" /><rect x="0" y="16" width="9" height="86" fill="#2A9D8F" stroke="none" stroke-width="2" rx="4" /><text x="55" y="77" font-family="Comic Sans MS" font-size="43" fill="#2A9D8F" font-weight="bold" >02</text><text x="163" y="77" font-family="Comic Sans MS" font-size="49" fill="#365866" font-weight="bold" >CHINA-ORIGIN PURCHASE SHARE REBOUNDS TO 37%</text><line x1="1335" y1="170" x2="1335" y2="1170" stroke="#D9E5EA" stroke-width="2" /><text x="72" y="191" font-family="Comic Sans MS" font-size="35" fill="#365866" font-weight="bold" >Origin of the latest cross-border purchase</text><text x="72" y="239" font-family="Comic Sans MS" font-size="27" fill="#718393" font-weight="normal" >Share of surveyed shoppers reporting China (%)</text><line x1="190" y1="685" x2="1240" y2="685" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="166" y="695" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">0%</text><line x1="190" y1="596.25" x2="1240" y2="596.25" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="166" y="606.25" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">10%</text><line x1="190" y1="507.5" x2="1240" y2="507.5" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="166" y="517.5" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">20%</text><line x1="190" y1="418.75" x2="1240" y2="418.75" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="166" y="428.75" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">30%</text><line x1="190" y1="330" x2="1240" y2="330" stroke="#D9E5EA" stroke-width="2" stroke-dasharray="6 7"/><text x="166" y="340" font-family="Comic Sans MS" font-size="28" fill="#718393" font-weight="normal" text-anchor="end">40%</text><polyline points="260,454.25 390,392.125 520,365.5 650,365.5 780,383.25 910,409.875 1040,418.75 1170,356.625" fill="none" stroke="#2A9D8F" stroke-width="7"/><circle cx="260" cy="454.25" r="11" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="5"/><text x="260" y="423.25" font-family="Comic Sans MS" font-size="43" fill="#365866" font-weight="bold" text-anchor="middle">26%</text><text x="260" y="742" font-family="Comic Sans MS" font-size="29" fill="#365866" font-weight="normal" text-anchor="middle">2016</text><circle cx="390" cy="392.125" r="11" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="5"/><text x="390" y="361.125" font-family="Comic Sans MS" font-size="31" fill="#365866" font-weight="bold" text-anchor="middle">33%</text><text x="390" y="742" font-family="Comic Sans MS" font-size="29" fill="#365866" font-weight="normal" text-anchor="middle">2017</text><circle cx="520" cy="365.5" r="11" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="5"/><text x="520" y="334.5" font-family="Comic Sans MS" font-size="31" fill="#365866" font-weight="bold" text-anchor="middle">36%</text><text x="520" y="742" font-family="Comic Sans MS" font-size="29" fill="#365866" font-weight="normal" text-anchor="middle">2018</text><circle cx="650" cy="365.5" r="11" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="5"/><text x="650" y="334.5" font-family="Comic Sans MS" font-size="31" fill="#365866" font-weight="bold" text-anchor="middle">36%</text><text x="650" y="742" font-family="Comic Sans MS" font-size="29" fill="#365866" font-weight="normal" text-anchor="middle">2019</text><circle cx="780" cy="383.25" r="11" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="5"/><text x="780" y="352.25" font-family="Comic Sans MS" font-size="31" fill="#365866" font-weight="bold" text-anchor="middle">34%</text><text x="780" y="742" font-family="Comic Sans MS" font-size="29" fill="#365866" font-weight="normal" text-anchor="middle">2020</text><circle cx="910" cy="409.875" r="11" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="5"/><text x="910" y="378.875" font-family="Comic Sans MS" font-size="31" fill="#365866" font-weight="bold" text-anchor="middle">31%</text><text x="910" y="742" font-family="Comic Sans MS" font-size="29" fill="#365866" font-weight="normal" text-anchor="middle">2021</text><circle cx="1040" cy="418.75" r="11" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="5"/><text x="1040" y="387.75" font-family="Comic Sans MS" font-size="31" fill="#365866" font-weight="bold" text-anchor="middle">30%</text><text x="1040" y="742" font-family="Comic Sans MS" font-size="29" fill="#365866" font-weight="normal" text-anchor="middle">2022</text><circle cx="1170" cy="356.625" r="11" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="5"/><text x="1170" y="325.625" font-family="Comic Sans MS" font-size="43" fill="#2A9D8F" font-weight="bold" text-anchor="middle">37%</text><text x="1170" y="742" font-family="Comic Sans MS" font-size="29" fill="#365866" font-weight="normal" text-anchor="middle">2023</text><text x="73" y="825" font-family="Comic Sans MS" font-size="39" fill="#2A9D8F" font-weight="bold" >2016–2023: +11 percentage points</text><text x="73" y="884" font-family="Comic Sans MS" font-size="32" fill="#365866" font-weight="bold" >The overall increase hides a reversal</text><g id="consumer_trend" data-paragraph="consumer_trend" data-right="1313"><text x="73" y="936" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">China’s share was 26% in 2016 and 37% in 2023, an 11-percentage-point increase.</text><text x="73" y="978" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">However, the endpoint comparison hides a reversal: the share fell from 36% in 2019</text><text x="73" y="1020" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">to 30% in 2022, before rising by seven points. The 2023 result was only one point</text><text x="73" y="1062" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">above 2019. Sellers therefore have reason to examine the intervening years when</text><text x="73" y="1104" font-family="Comic Sans MS" font-size="31" fill="#294052" font-weight="normal" data-text-line="true">assessing demand, rather than extending a smooth upward trend. [2,3]</text></g></g><text x="1385" y="200" font-family="Comic Sans MS" font-size="34" fill="#365866" font-weight="bold" >What does 37% mean?</text><g id="consumer_explain_0" data-paragraph="consumer_explain_0" data-right="2250"><text x="1385" y="252" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">The percentage measures the reported origin of</text><text x="1385" y="294" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">surveyed frequent cross-border shoppers’ latest</text><text x="1385" y="336" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">purchase, rather than the value of all sales. The trend</text><text x="1385" y="378" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">uses 24 countries, while the full 2023 survey covers</text><text x="1385" y="420" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">32,510 shoppers in 41 countries. This distinction matters</text><text x="1385" y="462" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">when comparing the survey with China’s national trade</text><text x="1385" y="504" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">totals: the two sources describe different populations</text><text x="1385" y="546" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">and measures.</text></g><text x="1385" y="598.6" font-family="Comic Sans MS" font-size="34" fill="#365866" font-weight="bold" >A service question for exporters</text><g id="consumer_explain_1" data-paragraph="consumer_explain_1" data-right="2250"><text x="1385" y="650.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">In the full survey, 71% were very or extremely satisfied</text><text x="1385" y="692.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">with the delivery location, compared with 42% for</text><text x="1385" y="734.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">customs, a 29-point gap. Our interpretation is that an</text><text x="1385" y="776.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">exporter could investigate how buyers receive customs</text><text x="1385" y="818.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">information and how delivery is coordinated. These are</text><text x="1385" y="860.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">practical questions to test in the intended destination;</text><text x="1385" y="902.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">the survey does not establish why satisfaction differs or</text><text x="1385" y="944.6" font-family="Comic Sans MS" font-size="32" fill="#294052" font-weight="normal" data-text-line="true">whether these services caused the purchase-origin trend.</text></g><line x1="65" y1="1195" x2="2255" y2="1195" stroke="#D9E5EA" stroke-width="2" /><a href="https://www.aof.org.hk/docs/default-source/hkimr/conference-workshop/panel-2_1_irina-fan.pdf" target="_blank"><g id="consumer_source" data-paragraph="consumer_source" data-right="2255"><text x="65" y="1240" font-family="Comic Sans MS" font-size="25" fill="#718393" font-weight="normal" data-text-line="true">Sources [2–3]: Fan / HKTDC (2024), slide 8; IPC (2024). Trend: 24 countries. Full 2023 survey: 32,510 frequent cross-border shoppers in 41 countries. All eight annual observations are</text><text x="65" y="1274" font-family="Comic Sans MS" font-size="25" fill="#718393" font-weight="normal" data-text-line="true">published values.</text></g></a></svg>