name: Poster validation

on:
  push:
    paths:
      - "poster/**"
      - "scripts/validate_poster_delivery.py"
      - ".github/workflows/poster-validation.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "poster/**"
      - "scripts/validate_poster_delivery.py"
      - ".github/workflows/poster-validation.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-poster-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate final poster artifacts and evidence records
        run: python scripts/validate_poster_delivery.py
